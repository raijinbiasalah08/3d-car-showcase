<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c26"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#bef264"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Hypercar Aerodynamic Silhouette -->
  <path d="M 85 320 C 110 320, 130 315, 155 295 C 185 270, 230 215, 290 205 C 345 195, 385 220, 420 280 C 435 305, 455 315, 470 318 L 475 324 L 450 338 L 415 338 C 400 315, 375 300, 345 300 C 315 300, 290 315, 275 338 L 195 338 C 180 315, 155 300, 125 300 C 98 300, 75 312, 60 332 Z" fill="url(#lime)" filter="url(#glow)"/>

  <!-- Cockpit canopy -->
  <path d="M 225 250 C 255 222, 285 212, 330 216 C 360 220, 385 240, 400 270 C 355 260, 310 255, 225 250 Z" fill="#080e14" opacity="0.85"/>

  <!-- Ground speed streaks -->
  <line x1="50" y1="380" x2="462" y2="380" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="120" y1="404" x2="390" y2="404" stroke="url(#lime)" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="190" y1="424" x2="320" y2="424" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- High-tech typography -->
  <text x="256" y="145" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="8">3D HYPERCAR</text>
  <text x="256" y="178" text-anchor="middle" fill="#00e5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" letter-spacing="6">STUDIO &amp; RUN</text>
</svg>

