<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d2d4cf" />
    <title>VERDE R1 — Hypercar Study</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

      :root {
        color-scheme: light;
        font-family: 'Manrope', 'Segoe UI', sans-serif;
        color: #f1f3ed;
        background: #17202a;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body { position: relative; }
      canvas { display: block; }

      .hud {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        padding: clamp(22px, 4vw, 56px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .masthead { display: flex; align-items: flex-start; justify-content: space-between; }
      .footline { display: flex; align-items: flex-end; justify-content: space-between; }
      .identity { display: flex; gap: 14px; align-items: flex-start; }
      .monogram {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border: 1px solid rgba(241, 243, 237, .42);
        border-radius: 50%;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -.08em;
        flex-shrink: 0;
      }
      .eyebrow, .spec-label, .gesture, .edition {
        font-family: 'DM Mono', Consolas, monospace;
        font-size: 9px;
        letter-spacing: .15em;
        text-transform: uppercase;
      }
      .eyebrow { opacity: .62; margin: 0 0 4px; }
      h1 { margin: 0; font-size: clamp(20px, 2.3vw, 29px); letter-spacing: .08em; font-weight: 700; line-height: 1; }
      .edition { opacity: .58; text-align: right; line-height: 1.7; flex-shrink: 0; }
      .descriptor { max-width: 290px; }
      .descriptor p { margin: 0; }
      .descriptor .eyebrow { margin-bottom: 8px; }
      .descriptor .copy { font-size: 12px; line-height: 1.65; opacity: .68; }
      .gesture { display: flex; gap: 22px; opacity: .58; }
      .gesture span { white-space: nowrap; }
      .gesture b { font-weight: 500; opacity: .7; margin-right: 6px; }

      .selector-rows {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-top: 10px;
        pointer-events: auto;
      }
      .selector-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .selector-label {
        font-family: 'DM Mono', Consolas, monospace;
        font-size: 8px;
        letter-spacing: .15em;
        opacity: .45;
        width: 38px;
      }
      .car-selector, .route-selector {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .car-btn, .route-btn {
        font-family: 'DM Mono', Consolas, monospace;
        font-size: 9px;
        letter-spacing: .08em;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(241, 243, 237, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 4px 10px;
        border-radius: 18px;
        cursor: pointer;
        transition: all .2s ease;
      }
      .car-btn:hover, .route-btn:hover {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.45);
      }
      .car-btn.active {
        background: #f1f3ed;
        color: #121820;
        border-color: #fff;
        font-weight: 700;
      }
      .route-btn.active {
        background: #00e5ff;
        color: #071018;
        border-color: #00e5ff;
        font-weight: 700;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
      }

      @media (max-width: 600px) {
        .hud { padding: 20px; }
        .edition { font-size: 8px; }
        .descriptor { max-width: 190px; }
        .descriptor .copy { font-size: 10px; }
        .gesture { flex-direction: column; gap: 7px; text-align: right; font-size: 8px; }
        .car-selector, .route-selector { gap: 4px; }
        .car-btn, .route-btn { font-size: 8px; padding: 3px 7px; }
      }
    </style>
  </head>
  <body>
    <main class="hud" aria-label="Automotive 3D presentation">
      <header class="masthead">
        <div class="identity">
          <div class="monogram" id="car-monogram" aria-hidden="true">V</div>
          <div>
            <p class="eyebrow" id="car-category">Advanced design studio</p>
            <h1 id="car-title">VERDE <span style="font-weight:400; opacity:.58">R1</span></h1>
            <div class="selector-rows">
              <div class="selector-row">
                <span class="selector-label">MODEL</span>
                <div class="car-selector" id="car-selector" aria-label="Select Car">
                  <button class="car-btn active" data-car="0">Verde R1</button>
                  <button class="car-btn" data-car="1">Lexus IS</button>
                  <button class="car-btn" data-car="2">Golf 8</button>
                  <button class="car-btn" data-car="3">Audi e-tron</button>
                </div>
              </div>
              <div class="selector-row">
                <span class="selector-label">ROUTE</span>
                <div class="route-selector" id="route-selector" aria-label="Select Route">
                  <button class="route-btn active" data-route="0">Waterfront</button>
                  <button class="route-btn" data-route="1">Skyway</button>
                  <button class="route-btn" data-route="2">Brooklyn Br</button>
                  <button class="route-btn" data-route="3">Metropolis</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="edition">LIVE MOTION<br /><span id="speed">078 KM/H</span> · LOOP 01</div>
      </header>

      <footer class="footline">
        <div class="descriptor">
          <p class="eyebrow" id="desc-eyebrow">Form follows velocity</p>
          <p class="copy" id="desc-copy">A hand-sculpted hypercar concept in a vivid acid-lime finish.</p>
        </div>
        <div class="gesture" aria-label="3D controls">
          <span><b>01</b>Drag to orbit</span>
          <span><b>02</b>W / ↑ drive</span>
          <span><b>03</b>S / ↓ brake</span>
          <span><b>04</b>A / D steer</span>
          <span><b>05</b>C switch car</span>
          <span><b>06</b>R switch route</span>
        </div>
      </footer>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
